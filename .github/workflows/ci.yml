name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/husnainmaroof

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    # Disposable databases for the DB-backed E2E suites. Their specs only run
    # against local scratch databases with these exact names and ports.
    services:
      purchase-del-db:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tijaratt_purchase_del_test
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      stock-lot-db:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tijaratt_stock_lot_scratch
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          # Placeholder only. Prisma validate/generate do not connect, and this is not a production database.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: npx prisma validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build backend
        run: npm run build

      - name: Create quantity test database
        env:
          PGPASSWORD: ci
        run: createdb -h 127.0.0.1 -p 55434 -U ci tijaratt_qty_test

      - name: Apply migrations to the E2E databases
        run: |
          for url in \
            postgresql://ci:ci@127.0.0.1:55434/tijaratt_purchase_del_test \
            postgresql://ci:ci@127.0.0.1:55434/tijaratt_qty_test \
            postgresql://ci:ci@127.0.0.1:55435/tijaratt_stock_lot_scratch; do
            DATABASE_URL="$url" DIRECT_URL="$url" npx prisma migrate deploy
          done

      - name: Run tests
        env:
          PURCHASE_DEL_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:55434/tijaratt_purchase_del_test
          QTY_E2E_DATABASE_URL: postgresql://ci:ci@127.0.0.1:55434/tijaratt_qty_test
          STOCK_LOT_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:55435/tijaratt_stock_lot_scratch
        # Benchmarks also match the test pattern; they are not part of CI.
        run: npm test -- --runInBand --testPathIgnorePatterns bench --json --outputFile=jest-results.json

      - name: Require the DB-backed E2E suites to have run
        run: node scripts/assert-db-suites-ran.cjs jest-results.json

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        env:
          # Same local origins as .env.example. Required because `next build` runs with NODE_ENV=production.
          TIJARATT_API_URL: http://127.0.0.1:4000
          CLIENT_ORIGIN: http://localhost:3000
        run: npm run build

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    # Only publish images after CI succeeds on main/master.
    # Pull requests still run the backend/frontend CI jobs,
    # but do not publish images to GHCR.
    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master'
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "VERSION=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "BACKEND_TAG=${{ env.IMAGE_PREFIX }}/tijaratt-backend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_TAG=${{ env.IMAGE_PREFIX }}/tijaratt-frontend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.BACKEND_TAG }}
            ${{ env.IMAGE_PREFIX }}/tijaratt-backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.FRONTEND_TAG }}
            ${{ env.IMAGE_PREFIX }}/tijaratt-frontend:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
