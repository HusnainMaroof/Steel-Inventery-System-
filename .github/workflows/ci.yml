name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          # Placeholder only. Prisma validate/generate do not connect, and this is not a production database.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: npx prisma validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build backend
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        env:
          # Same local origins as .env.example. Required because `next build` runs with NODE_ENV=production.
          TIJARATT_API_URL: http://127.0.0.1:4000
          CLIENT_ORIGIN: http://localhost:3000
        run: npm run build
