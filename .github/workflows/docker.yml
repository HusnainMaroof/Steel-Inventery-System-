name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/husnainmaroof

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "VERSION=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "BACKEND_TAG=${{ env.IMAGE_PREFIX }}/tijaratt-backend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_TAG=${{ env.IMAGE_PREFIX }}/tijaratt-frontend:${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.BACKEND_TAG }}
            ${{ env.IMAGE_PREFIX }}/tijaratt-backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.FRONTEND_TAG }}
            ${{ env.IMAGE_PREFIX }}/tijaratt-frontend:main
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
