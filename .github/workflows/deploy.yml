name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    if: github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: https://tijartt.com

    steps:
      - name: Checkout deployment config
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            docker-compose.yml
          sparse-checkout-cone: true

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Verify SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo 'SSH connection successful'"

      - name: Upload production Compose file
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            docker-compose.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/tijaratt/docker-compose.yml.new"

      # Remembers the running image tag and Compose file so a failed deploy can
      # roll back to them. Database migrations are not rolled back; use the
      # pre-migrate backup for that.
      - name: Record running version
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd /opt/tijaratt && \
             tag=$(docker inspect --format "{{.Config.Image}}" tijaratt-backend 2>/dev/null | sed "s/.*://" || true) && \
             printf "%s" "$tag" > .rollback_image_tag && \
             if [ -f docker-compose.yml ]; then cp -f docker-compose.yml docker-compose.yml.rollback; fi && \
             echo "Running version: ${tag:-none}"'

      - name: Deploy to VPS
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu

          SHORT_SHA="${DEPLOY_SHA:0:7}"

          echo "Deploying commit: ${DEPLOY_SHA}"
          echo "Docker image tag: ${SHORT_SHA}"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /opt/tijaratt && \
             export IMAGE_TAG='${SHORT_SHA}' && \
             docker compose -f docker-compose.yml.new config --quiet && \
             if [ -f docker-compose.yml ]; then \
               cp -f docker-compose.yml docker-compose.yml.previous; \
             fi && \
             mv -f docker-compose.yml.new docker-compose.yml && \
             docker compose config --quiet && \
             docker compose pull && \
             mkdir -p /opt/tijaratt/backups && \
             docker run --rm --env-file ./server/.env.production -v /opt/tijaratt/backups:/backups postgres:18 \
               sh -c 'set -e; url=\${DIRECT_URL#\\\"}; url=\${url%\\\"}; url=\$(printf %s \"\$url\" | sed -E \"s/([?&])schema=[^&]*&?/\\1/; s/[?&]\$//\"); file=/backups/pre-migrate-\$(date +%Y%m%d-%H%M%S).dump; pg_dump --format=custom --file=\"\$file\" \"\$url\"; pg_restore --list \"\$file\" > /dev/null; echo backup ok: \$file' && \
             docker compose run --rm backend npx prisma migrate deploy && \
             docker compose up -d"

      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu

          echo "Checking container status..."

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /opt/tijaratt && docker compose ps"

          # Readiness from inside the backend container first. This wakes a
          # suspended Neon compute, whose cold start can exceed the 6s timeout
          # of the public /api/health route.
          echo "Checking backend database readiness..."

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd /opt/tijaratt && \
             for i in $(seq 1 30); do \
               if docker compose exec -T backend node -e "fetch(\"http://127.0.0.1:4000/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then \
                 echo "Backend ready."; exit 0; \
               fi; \
               sleep 3; \
             done; \
             echo "Backend /health did not become ready."; \
             docker compose logs --tail 80 backend; \
             exit 1'

          echo "Checking public health endpoint..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 20 \
            --retry-delay 5 \
            --retry-connrefused \
            https://tijartt.com/api/health

          echo
          echo "Production deployment verified successfully."

      - name: Roll back to the previous version
        if: failure() && steps.deploy.outcome != 'skipped'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd /opt/tijaratt && \
             tag=$(cat .rollback_image_tag 2>/dev/null || true) && \
             if [ -z "$tag" ] || [ ! -f docker-compose.yml.rollback ]; then \
               echo "No previous version recorded. Nothing to roll back to."; exit 1; \
             fi && \
             cp -f docker-compose.yml.rollback docker-compose.yml && \
             IMAGE_TAG="$tag" docker compose up -d && \
             echo "Rolled back to image tag $tag." && \
             docker compose ps'
