services:

  backend:
    image: ghcr.io/husnainmaroof/tijaratt-backend:${IMAGE_TAG:-1.0.0}
    container_name: tijaratt-backend
    restart: unless-stopped

    env_file:
      - ./server/.env.production

    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: https://tijartt.com

    expose:
      - "4000"

    networks:
      - tijaratt-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  frontend:
    image: ghcr.io/husnainmaroof/tijaratt-frontend:${IMAGE_TAG:-1.0.0}
    container_name: tijaratt-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      TIJARATT_API_URL: http://backend:4000
      CLIENT_ORIGIN: https://tijartt.com

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - tijaratt-network

    ports:
      - "127.0.0.1:3000:3000"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:
  tijaratt-network:
    driver: bridge
